<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>MewHelp 智能客服</title>
    <!-- 图标内联成 data URI，不引外部文件：这套界面承诺"断网也能打开"，
         一个挂在 CDN 上的 favicon 会让每次加载都多一条 404。
         `#` 必须写成 %23，否则会被当成 URL 的片段标识符截断。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d7cff'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 首次绘制之前把主题定下来，避免"先闪一下白再变深色"。
      // 这段必须内联在 head 里：任何异步的模块都来不及。
      (function () {
        try {
          var saved = localStorage.getItem('mewhelp.theme') || 'system'
          var dark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
