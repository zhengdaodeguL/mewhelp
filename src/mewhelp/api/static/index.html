<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MewHelp · 智能客服演示台</title>
<style>
  /* 单文件、无 CDN、无外链字体 —— 断网也能双击打开。
     配色只用一个深色体系做到底，避免"半深半浅"的廉价感。 */
  :root {
    --bg: #0e1116;
    --panel: #151a21;
    --panel-2: #1b2129;
    --line: #242c36;
    --text: #e7ebf0;
    --muted: #8a94a3;
    --dim: #5d6774;
    --accent: #5b9dff;
    --green: #3fb950;
    --amber: #d5a021;
    --red: #f2555a;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; font-weight: 600; letter-spacing: .3px; }
  .brand .mark {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 3px rgba(63,185,80,.16);
    align-self: center;
  }
  .brand .sub { font-weight: 400; font-size: 12px; color: var(--muted); }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
    background: var(--panel-2); white-space: nowrap;
  }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.ok { border-color: rgba(63,185,80,.35); color: #9fdcab; }

  main {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr);
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  /* ---------------- 对话区 ---------------- */
  .chat { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  .transcript { flex: 1 1 auto; overflow-y: auto; padding: 22px 22px 8px; }
  .turn { margin-bottom: 18px; max-width: 780px; }
  .turn .who {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 5px;
  }
  .bubble {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; white-space: pre-wrap; word-break: break-word;
    background: var(--panel);
  }
  .turn.user { margin-left: auto; }
  .turn.user .who { text-align: right; }
  .turn.user .bubble { background: #1d2836; border-color: #2b3d55; }
  .turn.sys .bubble { background: transparent; border-style: dashed; color: var(--muted); font-size: 13px; }
  .caret {
    display: inline-block; width: 7px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 22px 0; }
  .quick button {
    font: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; transition: .14s;
  }
  .quick button:hover { color: var(--text); border-color: var(--accent); }
  .quick button:disabled { opacity: .45; cursor: default; }

  .composer { display: flex; gap: 10px; padding: 14px 22px 20px; }
  .composer input {
    flex: 1 1 auto; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 14px; outline: none;
  }
  .composer input:focus { border-color: var(--accent); }
  .composer button {
    font: inherit; font-weight: 600; cursor: pointer; color: #06121f;
    background: var(--accent); border: 0; border-radius: 10px; padding: 0 20px;
  }
  .composer button:disabled { opacity: .5; cursor: default; }

  /* ---------------- 检视面板 ---------------- */
  .inspect { overflow-y: auto; padding: 18px; background: #10141a; }
  .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px; margin-bottom: 12px; }
  .panel h2 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel h2 .count { font-family: var(--mono); color: var(--muted); letter-spacing: 0; }
  .empty { color: var(--dim); font-size: 12px; }
  .mono { font-family: var(--mono); font-size: 12px; }

  /* 分流路径：这一行是整个项目最该被看见的东西 */
  .path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .path .node {
    font-family: var(--mono); font-size: 12px; padding: 3px 8px;
    border-radius: 6px; background: #1d2634; border: 1px solid #2b3d55; color: #bcd4f5;
  }
  .path .node.hi { background: #23324a; border-color: var(--accent); color: #dbe9ff; }
  .path .arrow { color: var(--dim); font-size: 11px; }

  .verdict { display: flex; gap: 10px; flex-wrap: wrap; }
  .kv { flex: 1 1 0; min-width: 120px; }
  .kv .k { font-size: 11px; color: var(--dim); }
  .kv .v { font-family: var(--mono); font-size: 13px; margin-top: 2px; word-break: break-all; }
  .v.intent { color: #ffd479; }
  .v.exit-knowledge { color: #78c6ff; }
  .v.exit-business_tool { color: #8ee08e; }
  .v.exit-high_risk { color: #ff9d8a; }
  .v.exit-handoff { color: #d9a5ff; }
  .v.exit-fallback { color: var(--muted); }
  .raw { margin-top: 4px; color: var(--muted); font-size: 12px; }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 0; border-top: 1px solid var(--line); font-size: 12px;
  }
  ul.list li:first-child { border-top: 0; }
  ul.list li .idx { font-family: var(--mono); color: var(--dim); }
  ul.list li .title { flex: 1 1 auto; word-break: break-word; }
  ul.list li .score { font-family: var(--mono); color: var(--muted); }
  .bar { height: 3px; border-radius: 2px; background: #2a323d; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }

  .stat-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .stat-row span:last-child { font-family: var(--mono); color: var(--muted); }
  .tag { border-radius: 5px; padding: 1px 7px; font-size: 11px; font-family: var(--mono); }
  .tag.handoff { background: rgba(242,85,90,.14); color: #ff9a9e; border: 1px solid rgba(242,85,90,.3); }
  .tag.answered { background: rgba(63,185,80,.12); color: #97e0a4; border: 1px solid rgba(63,185,80,.28); }
  .tag.warn { background: rgba(213,160,33,.14); color: #ffd479; border: 1px solid rgba(213,160,33,.3); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark"></span>MewHelp
    <span class="sub">电商智能客服 · Workflow + Agent 混合架构</span>
  </div>
  <div class="modes" id="modes"><span class="pill">连接中…</span></div>
</header>

<main>
  <section class="chat">
    <div class="transcript" id="transcript"></div>
    <div class="quick" id="quick"></div>
    <form class="composer" id="composer">
      <input id="input" placeholder="说点什么，比如：帮我查下订单 ORD-1002 到哪了" autocomplete="off">
      <button id="send" type="submit">发送</button>
    </form>
  </section>

  <aside class="inspect">
    <div class="panel">
      <h2>分流路径<span class="count" id="path-count"></span></h2>
      <div class="path" id="path"><span class="empty">等待请求…</span></div>
    </div>
    <div class="panel">
      <h2>意图 / 出口</h2>
      <div class="verdict" id="verdict"><span class="empty">—</span></div>
    </div>
    <div class="panel">
      <h2>检索证据<span class="count" id="ev-count"></span></h2>
      <ul class="list" id="evidence"><li class="empty">—</li></ul>
    </div>
    <div class="panel">
      <h2>工具调用<span class="count" id="tool-count"></span></h2>
      <ul class="list" id="tools"><li class="empty">—</li></ul>
    </div>
    <div class="panel" id="stats"><span class="empty">—</span></div>
  </aside>
</main>

<script>
"use strict";
/* 前端只做三件事：发消息、按事件名渲染、把"分流路径"摆在最显眼的位置。
   解析 SSE 用 fetch + ReadableStream（EventSource 只支持 GET，带不了 body）。 */

const SESSION_ID = "s-web-" + Math.random().toString(36).slice(2, 10);
const USER_ID = "u-web";

const PRESETS = [
  { label: "查物流（business_tool）", text: "帮我查下订单 ORD-1002 到哪了" },
  { label: "问政策（knowledge）", text: "生鲜类可以退款吗" },
  { label: "申请退款（high_risk 中断）", text: "我要退款" },
  { label: "知识库外（拒答转人工）", text: "你们卖不卖火箭" },
  { label: "转人工（handoff）", text: "我要找人工" }
];

const $ = (id) => document.getElementById(id);
const transcript = $("transcript");
let busy = false;

/* ---------------- 启动：读一次健康检查，把各组件模式亮出来 ---------------- */
(async function health() {
  try {
    const r = await fetch("/api/health");
    const h = await r.json();
    const c = h.components || {};
    const pill = (k, v) => `<span class="pill">${k} <b>${v}</b></span>`;
    $("modes").innerHTML =
      (h.fully_mocked ? '<span class="pill ok">离线全 mock</span>' : "") +
      pill("llm", c.llm) + pill("embedding", c.embedding) +
      pill("vector_store", c.vector_store) + pill("db", c.database) +
      pill("chunks", h.kb_chunks);
  } catch (e) {
    $("modes").innerHTML = '<span class="pill" style="color:#ff9a9e">后端未连通</span>';
  }
})();

/* ---------------- 快捷问题 ---------------- */
$("quick").innerHTML = PRESETS.map(
  (p, i) => `<button type="button" data-i="${i}">${p.label}</button>`
).join("");
$("quick").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || busy) return;
  send(PRESETS[Number(b.dataset.i)].text);
});

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (text) send(text);
});

/* ---------------- 消息气泡 ---------------- */
function bubble(who, cls) {
  const turn = document.createElement("div");
  turn.className = "turn " + cls;
  const label = document.createElement("div");
  label.className = "who";
  label.textContent = who;
  const body = document.createElement("div");
  body.className = "bubble";
  turn.append(label, body);
  transcript.appendChild(turn);
  transcript.scrollTop = transcript.scrollHeight;
  return body;
}

function setBusy(v) {
  busy = v;
  $("send").disabled = v;
  $("input").disabled = v;
  document.querySelectorAll("#quick button").forEach((b) => (b.disabled = v));
}

/* ---------------- 发送并消费 SSE ---------------- */
async function send(text) {
  $("input").value = "";
  bubble("你", "user").textContent = text;
  const body = bubble("MewHelp", "assistant");
  const caret = document.createElement("span");
  caret.className = "caret";
  body.appendChild(caret);
  resetInspector();
  setBusy(true);

  let answer = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: USER_ID, session_id: SESSION_ID, message: text })
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      // sse-starlette 用 \r\n 分行；统一成 \n 之后按空行切事件。
      buf = normalizeSse(buf + decoder.decode(value, { stream: true }));
      const drained = drainEvents(buf);
      buf = drained.rest;
      for (const ev of drained.events) {
        if (ev.event === "token") {
          const t = (ev.data && ev.data.text) || "";
          answer += t;
          caret.insertAdjacentText("beforebegin", t);
          transcript.scrollTop = transcript.scrollHeight;
        } else {
          render(ev.event, ev.data);
        }
      }
    }
  } catch (err) {
    body.textContent = "请求失败：" + err.message;
  } finally {
    caret.remove();
    if (!answer) body.textContent = body.textContent || "（无输出）";
    setBusy(false);
    $("input").focus();
  }
}

/* #region sse-parser
   纯函数区：不碰 DOM，因此可以被 node 直接加载来验证"服务端推的字节、
   前端解析出来的事件"完全一致（见 tests/test_api.py 的跨语言一致性用例）。
   把这几个函数关在这里，是为了让"SSE 契约"有一个可执行的定义，
   而不是两份各写一遍、靠人眼比对的实现。 */
function normalizeSse(chunk) {
  // sse-starlette 默认用 \r\n 分行，而事件分隔是空行 —— 不归一化的话
  // 客户端按 "\n\n" 切永远切不开，表现为"一个事件都收不到"。
  return String(chunk).replace(/\r\n/g, "\n");
}

function parseEvent(block) {
  let name = "message", data = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) name = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { event: name, data: JSON.parse(data) }; }
  catch (e) { return { event: name, data: {} }; }
}

function drainEvents(buffer) {
  // 一个事件可能被 TCP 切成几段送过来，所以"切完剩下的半截"必须留在 buffer 里
  // 等下一段 —— 直接丢弃会表现为"偶尔丢几个字"，是最难复现的一类 bug。
  const events = [];
  let cut;
  while ((cut = buffer.indexOf("\n\n")) >= 0) {
    const block = buffer.slice(0, cut);
    buffer = buffer.slice(cut + 2);
    const ev = parseEvent(block);
    if (ev) events.push(ev);
  }
  return { events: events, rest: buffer };
}
/* #endregion sse-parser */

/* ---------------- 检视面板渲染 ---------------- */
function resetInspector() {
  $("path").innerHTML = '<span class="empty">等待分流…</span>';
  $("path-count").textContent = "";
  $("verdict").innerHTML = '<span class="empty">—</span>';
  $("evidence").innerHTML = '<li class="empty">—</li>';
  $("tools").innerHTML = '<li class="empty">—</li>';
  $("ev-count").textContent = "";
  $("tool-count").textContent = "";
  $("stats").innerHTML = '<span class="empty">—</span>';
}

function render(event, data) {
  if (event === "meta") return renderMeta(data);
  if (event === "evidence") return renderEvidence(data);
  if (event === "tool") return renderTool(data);
  if (event === "done") return renderDone(data);
  if (event === "error") {
    $("stats").innerHTML = '<span class="tag handoff">流内错误</span> ' +
      '<span class="raw">' + esc(data.message || "") + "</span>";
  }
}

function renderMeta(d) {
  const path = d.path || [];
  $("path-count").textContent = path.length ? path.length + " 步" : "";
  $("path").innerHTML = path.length
    ? path.map((n, i) =>
        (i ? '<span class="arrow">→</span>' : "") +
        '<span class="node' + (/gate|high_risk_flow|classify/.test(n) ? " hi" : "") + '">' + esc(n) + "</span>"
      ).join("")
    : '<span class="empty">未走流水线</span>';

  const rows = [
    ["intent", d.intent || "—", "intent"],
    ["exit", d.exit || "—", "exit-" + (d.exit || "none")],
    ["request_id", d.request_id || "—", ""]
  ];
  $("verdict").innerHTML = rows.map(([k, v, cls]) =>
    '<div class="kv"><div class="k">' + k + '</div><div class="v ' + cls + '">' + esc(v) + "</div></div>"
  ).join("") + (d.resolved_question
    ? '<div class="raw" style="flex:1 1 100%">消解后：' + esc(d.resolved_question) + "</div>" : "");
}

function renderEvidence(d) {
  const chunks = d.chunks || [];
  $("ev-count").textContent = chunks.length ? chunks.length + " 条" : "0 条";
  $("evidence").innerHTML = chunks.length
    ? chunks.map((c, i) => {
        const pct = Math.max(2, Math.round((c.score || 0) * 100));
        return '<li><span class="idx">' + (i + 1) + "</span>" +
          '<span class="title">' + esc(c.title) +
          '<div class="bar"><i style="width:' + pct + '%"></i></div></span>' +
          '<span class="score">' + (c.score != null ? c.score.toFixed(3) : "") + "</span></li>";
      }).join("")
    : '<li class="empty">本次没有走检索（或未召回证据）</li>';
}

function renderTool(t) {
  const ul = $("tools");
  if (ul.querySelector(".empty")) ul.innerHTML = "";
  const li = document.createElement("li");
  li.innerHTML = '<span class="idx">' + (t.ok ? "✓" : "✕") + "</span>" +
    '<span class="title">' + esc(t.name) + "</span>" +
    '<span class="score">' + esc(t.error || "ok") + "</span>";
  ul.appendChild(li);
  $("tool-count").textContent = ul.children.length + " 次";
}

function renderDone(d) {
  const u = d.usage || {};
  const badge = d.handoff
    ? '<span class="tag handoff">转人工</span>'
    : '<span class="tag answered">已答复</span>';
  const reason = d.refusal_reason
    ? ' <span class="tag warn">' + esc(d.refusal_reason) + "</span>" : "";
  $("stats").innerHTML =
    "<div>" + badge + reason + "</div>" +
    row("耗时", (d.latency_ms != null ? d.latency_ms + " ms" : "—")) +
    row("tokens", (u.input_tokens || 0) + " in / " + (u.output_tokens || 0) + " out") +
    row("成本", "$" + (u.cost_usd || 0).toFixed(4));
}

function row(k, v) {
  return '<div class="stat-row"><span>' + k + "</span><span>" + esc(String(v)) + "</span></div>";
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* 开场提示：让第一次打开的人知道该点哪里 */
bubble("系统", "sys").textContent =
  "离线演示：LLM / Embedding / 向量库全部走 mock，不需要 API Key。点下面的快捷问题，或直接输入。";
</script>
</body>
</html>
